name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        run: |
          chmod +x scripts/release-notes.sh
          scripts/release-notes.sh "${{ steps.ver.outputs.version }}" > release-notes.md
          cat release-notes.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-s -w -X liking/internal/version.Version=${VERSION}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" \
              -o dist/liking-agent-linux-$arch ./cmd/agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/liking-server-linux-$arch ./cmd/server
          done
          cp dist/liking-server-linux-amd64 dist/liking-server
          cp dist/liking-agent-linux-amd64 dist/liking-agent
          (cd dist && sha256sum liking-server liking-agent liking-server-linux-amd64 liking-agent-linux-amd64 liking-server-linux-arm64 liking-agent-linux-arm64 > SHA256SUMS)
          cp install.sh CHANGELOG.md dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/liking-server
            dist/liking-agent
            dist/liking-server-linux-amd64
            dist/liking-agent-linux-amd64
            dist/liking-server-linux-arm64
            dist/liking-agent-linux-arm64
            dist/SHA256SUMS
            dist/install.sh
            dist/CHANGELOG.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
