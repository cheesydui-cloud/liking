name: liking

services:
  liking:
    image: liking:panel
    container_name: liking
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - /var/lib/liking:/var/lib/liking
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/liking-docker:/opt/liking-docker
    environment:
      LIKING_TRUST_DOCKER_GATEWAY: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      liking.panel: "1"
